<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waterfall Sanctuary | Calm Live Ambience</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #07130f;
      color: #f4f0dd;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
      background: #0a1711;
    }
    .scene::before {
      content: '';
      position: absolute;
      inset: -3%;
      z-index: -3;
      background: url('https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=2400&q=90') center / cover;
      filter: saturate(.9) contrast(1.05) brightness(.72);
      transform: scale(1.04);
      animation: slowCamera 24s ease-in-out infinite alternate;
    }
    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(180deg, rgba(3, 12, 9, .18), rgba(3, 11, 8, .36) 52%, rgba(3, 8, 6, .82));
    }
    .arch {
      position: absolute;
      left: 50%;
      top: 8%;
      width: min(76vw, 920px);
      height: min(76vw, 920px);
      transform: translateX(-50%);
      border: 18px solid rgba(85, 48, 27, .64);
      border-bottom: 0;
      border-radius: 50% 50% 0 0;
      box-shadow: 0 0 0 8px rgba(20, 14, 9, .35), inset 0 10px 18px rgba(255, 205, 126, .12);
      opacity: .92;
      pointer-events: none;
    }
    .water-glow {
      position: absolute;
      left: 50%;
      top: 17%;
      width: min(24vw, 310px);
      height: 56%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(222, 250, 235, .2), rgba(255,255,255,.58), rgba(222,250,235,.16), transparent);
      filter: blur(18px);
      mix-blend-mode: screen;
      opacity: .6;
      animation: waterPulse 3.6s ease-in-out infinite;
      pointer-events: none;
    }
    .mist {
      position: absolute;
      left: 50%;
      bottom: 29%;
      width: 58%;
      height: 18%;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(229, 250, 234, .22), transparent 68%);
      filter: blur(18px);
      animation: mistDrift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .foreground {
      position: absolute;
      inset: auto 0 0;
      height: 31%;
      background: linear-gradient(180deg, transparent, rgba(2, 8, 6, .18) 20%, rgba(3, 10, 7, .78));
      pointer-events: none;
    }
    .candle {
      position: absolute;
      bottom: 18%;
      width: 18px;
      height: 42px;
      border-radius: 3px 3px 6px 6px;
      background: linear-gradient(90deg, #9c6d38, #f4d48b, #85562c);
      box-shadow: 0 0 34px 15px rgba(255, 185, 74, .16);
      animation: candleGlow 2.6s ease-in-out infinite alternate;
    }
    .candle::before {
      content: '';
      position: absolute;
      left: 5px;
      top: -25px;
      width: 9px;
      height: 24px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: #ffd987;
      box-shadow: 0 0 18px 8px rgba(255, 196, 89, .48);
    }
    .candle.one { left: 14%; }
    .candle.two { right: 16%; height: 32px; animation-delay: -.8s; }
    .candle.three { left: 24%; bottom: 14%; height: 28px; animation-delay: -1.4s; }
    .dust { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255, 231, 164, .65); animation: floatDust 13s linear infinite; }
    .dust i:nth-child(1) { left: 18%; top: 70%; animation-delay: -2s; }
    .dust i:nth-child(2) { left: 32%; top: 52%; animation-delay: -8s; }
    .dust i:nth-child(3) { left: 68%; top: 62%; animation-delay: -5s; }
    .dust i:nth-child(4) { left: 82%; top: 44%; animation-delay: -10s; }
    .hud {
      position: absolute;
      top: 28px;
      left: 34px;
      right: 34px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }
    .brand { text-shadow: 0 2px 18px rgba(0,0,0,.7); }
    .eyebrow { margin-bottom: 8px; color: #dfc78a; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 58px); font-weight: 400; letter-spacing: 1px; }
    .live {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 226, 169, .35);
      border-radius: 999px;
      background: rgba(7, 17, 12, .48);
      color: #f3d68d;
      font: 700 12px Arial, sans-serif;
      letter-spacing: 2px;
    }
    .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #e5a34e; box-shadow: 0 0 13px #e5a34e; }
    .bottom {
      position: absolute;
      left: 50%;
      bottom: 34px;
      width: min(720px, calc(100% - 48px));
      transform: translateX(-50%);
      text-align: center;
      text-shadow: 0 2px 16px #000;
    }
    .quote { margin: 0 0 16px; font-size: clamp(17px, 2vw, 26px); letter-spacing: .5px; }
    .control {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 18px;
      border: 1px solid rgba(245, 222, 157, .55);
      border-radius: 999px;
      background: rgba(8, 21, 14, .68);
      color: #f5e2ae;
      cursor: pointer;
      font: 700 12px Arial, sans-serif;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      transition: background .25s, transform .25s;
    }
    .control:hover { background: rgba(47, 83, 54, .76); transform: translateY(-2px); }
    .control span { font-size: 16px; }
    @keyframes slowCamera { to { transform: scale(1.1) translate3d(-1%, -1%, 0); } }
    @keyframes waterPulse { 50% { opacity: .85; transform: translateX(-50%) scaleX(1.18); } }
    @keyframes mistDrift { to { transform: translateX(-47%) translateY(-9px) scale(1.1); } }
    @keyframes candleGlow { to { filter: brightness(1.18); box-shadow: 0 0 42px 18px rgba(255, 185, 74, .22); } }
    @keyframes floatDust { 0% { transform: translate(0, 30px); opacity: 0; } 20%, 80% { opacity: .8; } 100% { transform: translate(70px, -180px); opacity: 0; } }
    @media (max-width: 620px) { .hud { left: 20px; right: 20px; top: 20px; } .live { padding: 8px 10px; font-size: 10px; } .arch { border-width: 10px; } .bottom { bottom: 22px; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="Calm waterfall ambience">
    <div class="arch"></div>
    <div class="water-glow"></div>
    <div class="mist"></div>
    <div class="dust"><i></i><i></i><i></i><i></i></div>
    <div class="candle one"></div><div class="candle two"></div><div class="candle three"></div>
    <div class="foreground"></div>
    <header class="hud">
      <div class="brand"><div class="eyebrow">Live ambient sanctuary</div><h1>Waterfall Stillness</h1></div>
      <div class="live">LIVE AMBIENCE</div>
    </header>
    <footer class="bottom">
      <p class="quote">Let the water carry the noise away.</p>
      <button class="control" id="sound-toggle" type="button"><span>◉</span> Begin gentle sound</button>
    </footer>
  </main>
  <script>
    let audioContext;
    let masterGain;
    let ambienceStarted = false;

    function startAmbience() {
      if (ambienceStarted) return;
      ambienceStarted = true;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioContext.createGain();
      masterGain.gain.value = 0.045;
      masterGain.connect(audioContext.destination);

      const notes = [196, 246.94, 293.66, 369.99];
      notes.forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gain.gain.value = 0.12 / (index + 1);
        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start();
      });

      const bufferSize = audioContext.sampleRate * 2;
      const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.18;
      const water = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const waterGain = audioContext.createGain();
      water.buffer = buffer;
      water.loop = true;
      filter.type = 'lowpass';
      filter.frequency.value = 1700;
      waterGain.gain.value = 0.22;
      water.connect(filter);
      filter.connect(waterGain);
      waterGain.connect(masterGain);
      water.start();

      document.getElementById('sound-toggle').innerHTML = '<span>◉</span> Gentle sound on';
    }

    document.getElementById('sound-toggle').addEventListener('click', startAmbience);
  </script>
</body>
</html>
